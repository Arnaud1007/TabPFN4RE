row_grain: parcel polygon, not necessarily a single dwelling or sale
candidate_join_fields: [PIN, FOLIO]
documented_field_semantics:
  DOR_C: primary parcel use code; local descriptions are in parcel_dor_names.dbf
  HEAT_AR: heated living square feet summed over all buildings on a parcel
  tBEDS: bedrooms summed over all buildings on a parcel
  tBATHS: bathrooms summed over all buildings on a parcel
  tUNITS: living units summed over all buildings on a parcel
  tBLDGS: number of buildings on the parcel
  S_DATE: date of a qualified sale in this parcel archive, not verified closing date
  AMT: qualified sale amount in this parcel archive, not an as-of property attribute
code_mapping_status: >-
  The readme lists 0100 among codes for which room/unit totals are generally
  accurate and describes that list as private residential and smaller
  multifamily parcels. The county's separate DOR Code Manual describes 0100
  as detached single-family residential. The 2026-09-25 current parcel ZIP's
  embedded parcel_dor_names.dbf was inspected and confirms 0100 as SINGLE
  FAMILY R. This is a current lookup, not a verified code vintage for old
  archive rows. Parcel use alone cannot establish one eligible dwelling.
code_manual_source_card: data/source_cards/hillsborough_hcpa_dor_manual.yaml
current_code_table_source_card: data/source_cards/hillsborough_hcpa_current_parcels.yaml
historical_vintage_caveat: >-
  The readme warns that earlier shapefiles may lack fields and says parcels
  are archived in the fall after tax-value notices, corrections and appeals.
  The current listing's 2004-2021 files show 2021 update timestamps. Archive
  year and current listing timestamp do not prove original first availability
  or an attribute's availability at an earlier valuation origin.
