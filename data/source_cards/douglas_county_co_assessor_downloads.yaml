notes: >-
  The official page calls these current database records for active accounts
  and disclaims accuracy and timeliness. Its download language supports
  public reporting access but does not establish commercial AVM or row
  redistribution rights. A file Last-Modified header is not a transaction's
  first public availability. The assessor FAQ describes adjustments in its
  valuation study, but does not say whether this raw Sale_Price field is a
  contractual, adjusted or other consideration amount. Do not join one sale
  to multiple Building_ID rows or use current improvements as historical
  features without audited cardinality and dated vintages. The confidential
  declaration cannot itself be used as a public row-level verification route.
