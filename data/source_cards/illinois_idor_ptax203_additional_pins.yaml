notes: >-
  The official page describes additional properties included in declarations
  transferring two or more properties. A declaration ID is a foreign key, not
  a unique row key; duplicate additional-PIN observations must be preserved.
  Zero returned rows do not prove a single parcel. PINs can include part-parcel
  or ROW-only cases under IDOR instructions. This source cannot allocate
  declaration-level consideration, prove close dates or row-first availability.
  The v1 metadata check failed before any row query because the metadata omits
  rowIdentifierColumnId; ADR 0060 registers the corrected v2 protocol.
