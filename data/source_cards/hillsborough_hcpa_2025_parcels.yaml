empirical_sales_identifier_control: >-
  A separately frozen, date/qualification-stratified 1,000-row All Sales
  sample has 984 sale rows with one exact raw PIN+FOLIO match in this 2025
  archive and 16 without one. The 984 rows represent 983 distinct controls
  with nonblank STRAP; the candidate conversion agreed for all 983. This
  selected-sample result is not a county-wide linkage rate or a verified
  dwelling/transaction link. See
  runs/u0-hcpa-pin-crosswalk-20260928T214110Z/report.md.
frozen_gap_diagnostic: >-
  A subsequent pinned-input audit of the same 1,000 rows found that six of
  the 16 without an exact two-key control have a unique FOLIO-only lead with
  an all-space PIN and a STRAP agreeing with the candidate transform. Ten have
  no one-key lead. These remain unmatched; no one-key promotion or historical
  as-of inference follows. See
  runs/u0-hcpa-pin-gaps-20260928T222200Z/report.md.
