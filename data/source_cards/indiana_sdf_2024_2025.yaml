archive_format: UTF-16 tab-delimited quoted text inside ZIP; embedded parsing-metadata workbook
geography: Indiana counties; publisher notes current-year county coverage can be partial
row_grain: >-
  SALEDISC may repeat SDF_ID rows; multiple SDF_ID forms may share one
  Unique_Sales_ID economic transaction. SALEPARCEL may contain multiple
  parcels per form. One price cannot be copied to every parcel as a label.
target_candidate: E1_Sales_Price, gross disclosed consideration in USD
target_storage: integer source value with implied two decimal places; divide by 100
acreage_storage: P2_9_Acreage is integer source value with implied four decimal places; divide by 10000
sale_date_candidate: P2_13_Date_Sale
first_availability: not established for individual records
attribute_vintage: not established before a 90-day pre-sale origin
assessment_vintage_observation: >-
  DLGF form instructions call P2_2 and P2_3 the assessor's most recent
  assessed values when completing the sale form. They do not identify a
  value snapshot published before the 90-day prediction origin. A local
  Marion 2023-assessment PARCEL extract, SHA-256
  b4e32805a21c38fab0bd9b6825946ec1e8d87ce412dbce5ffc27d44fbabd0eae,
  declares file creation on 2025-04-19, so this copy cannot prove its exact
  values were available in 2023 or before an individual 2024 sale.
rights_decision: >-
  Publisher describes these files as available for research. Local private
  research is the current use; commercial AVM and redistribution permissions
  have not been established.
redistribution_decision: raw rows, names, addresses, row predictions and model bundle remain Git-ignored
predictor_allowlist: [County_ID, A5_ZipCode, P2_9_Acreage]
snapshot_assessment_diagnostic_allowlist: [County_ID, A5_ZipCode, P2_9_Acreage, P2_2_AV_Land, P2_3_AV_Improvement, P2_7_Neighborhood_Code]
snapshot_assessment_diagnostic_status: retrospective_development_only_not_pre_sale_eligible
snapshot_assessment_diagnostic_run: runs/indiana-assessment-diagnostic-v1/report.md
snapshot_assessment_diagnostic_warning: >-
  Assessed values are observed in retrieved sale-disclosure snapshots. Their
  original vintage, first availability before sale and possible post-sale
  revision have not been established. The improved development score cannot
  certify a 90-day OFF or current-home predictor.
excluded_predictor_examples: [E1_Sales_Price, C8_Market_Days, P2_5_Total_AV, P2_14_Date_Received, P2_16_Valid_Trending, SDF_ID, Unique_Sales_ID]
research_cohort: one-family class 510-515, one disclosure and one parcel per economic sale
manual_source_audit: >-
  Twenty deliberately low-price 2025 records inspected; none has a final
  arm's-length determination or independent cross-check. The remaining 180
  selected records and the broader US07 source audit are pending.
targeted_low_price_audit_plan: decisions/0093-indiana-low-price-source-audit-sample.md
targeted_low_price_audit_progress: runs/indiana-assessment-diagnostic-v1/audit_review_first20.json
assessment_90_day_off_decision: blocked for this snapshot; see decisions/0094-indiana-assessment-asof-no-go.md
trending_flag_policy: >-
  P2_16_Valid_Trending is a post-sale assessor validation field. It may be
  used to stratify source-quality review, but not as a pre-sale predictor or
  a post-hoc test-set filter. The fixed 2025 development score includes both
  Y and N sales.
protocol: indiana_sdf_2024_2025_retrospective_research_v1
decision: decisions/0090-indiana-prediction-first-research-benchmark.md
research_run: runs/indiana-sdf-20261004-v1/report.md
research_eligible_rows: {year_2024: 65490, year_2025: 71054}
research_quality_alert: >-
  Included positive consideration ranges from $0.01 to $244,000,110,000 in
  2024 and $1 to $1,050,000,000 in 2025. These extremes remain in the
  retrospective score; factual validity requires a stratified manual audit.
prohibited_claims: [certified_90_day_origin, current_us_accuracy, commercial_release, g_us]
