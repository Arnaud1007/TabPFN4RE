manual_scope: >-
  A supplement with explanatory text for selected four-character county DOR
  codes. It says parcel_dor_names.dbf, extracted from the CAMA system, is the
  definitive current code list and that this manual is not complete or
  automatically updated.
documented_code_examples:
  '0100': detached single-family residential
  '0102': single-family home built around a mobile home
  '0106': townhouse or villa
  '0200': mobile home
  '0300': multifamily over nine units
  '0400': condominium
  '0500': cooperative
  '0800': multifamily under ten units
use_limit: >-
  These are documentation examples, not a validated historical mapping for
  every All Sales row. The code is primary parcel use, not proof that a deed
  conveyed one eligible dwelling or that its amount is attributable to it.
historical_availability: >-
  The current listing's 2021 update date and document properties do not prove
  when each code or sale row was publicly available at an earlier origin.
