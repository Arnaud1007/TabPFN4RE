all_sales_sample_linkage: >-
  On the frozen edge-enriched 200-row All Sales sample, exact trimmed PIN and
  FOLIO found zero two-key matches in this current parcel DBF. Every sampled
  row had one FOLIO-only lead; none was admitted as a joined parcel. The 36
  rows previously flagged in repeated instrument groups followed the same
  pattern. This is not a county-level rate or proof of incompatible identity;
  PIN format appears to vary by archive vintage. See
  runs/u0-hcpa-parcel-links-20260928T203944Z/report.md.
empirical_pin_crosswalk: >-
  On a separately frozen 1,000-row All Sales sample that excluded the original
  200 discovery rows, the predeclared PIN transform agreed with 994 of 994
  nonblank current parcel PINs reached through a unique FOLIO lead; six more
  current PINs were blank. The 2025 STRAP control agreed for 983 of 983
  distinct nonblank controls. This is an empirical format result, not a
  publisher-confirmed identifier contract or an accepted property join. See
  runs/u0-hcpa-pin-crosswalk-20260928T214110Z/report.md.
code_semantics: >-
  This current code table corroborates the county DOR manual's examples but
  does not verify the historical DOR_CODE of each All Sales entry, whether a
  parcel contains one dwelling, or whether a deed price belongs to that home.
