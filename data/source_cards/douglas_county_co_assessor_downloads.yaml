transfer_declaration_price_note: >-
  The confidential TD-1000 form asks for total sale price including real and
  personal property, a separately stated personal-property total and a
  contracted price if different. The mass-appraisal page says selected sales
  are screened, adjusted for personal property and time-adjusted. Neither
  source defines the public download's Sale_Price field or its adjustment state.
