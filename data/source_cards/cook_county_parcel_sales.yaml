notes: >-
  The current published extract is a concrete acquisition candidate, not a certified
  label source. The portal's own description says sale_date is recorded rather than
  executed, older dates may be monthly, and many rows reach the Assessor months late.
  No per-record first-publication timestamp or historical extract was found in the
  retrieved schema. Do not map sale_date to a precise close_date or infer unknown
  concessions and arm's-length status from price alone.
