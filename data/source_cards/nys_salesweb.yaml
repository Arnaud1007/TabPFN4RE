  Economic transfer, parcel and dwelling cardinality require audit. Official
  quarterly guidance uses book/page for correction matching and warns that
  an erroneous match can update the wrong sale.
target_candidate_field: sale_price
target_candidate_currency: USD
target_candidate_semantics: >-
  Current CSV contains sale_price and personal_prop, but their transaction
  semantics are not verified from header names. The indexed legacy dictionary
  describes sale price as total amount paid minus personal property, whereas
  the rendered current detail-page help says personal property is included in
  the sale price. The mapping and price basis require current publisher or
  instrument evidence before a gross consideration target is admitted.
full_sale_price_semantics: RP-5217 item 13 includes cash, property, assumed obligations and personal property
concessions_note: >-
  RP-5217 instructions exclude seller concessions from full sale price, while
  official quarterly guidance documents wrongly inclusive prices corrected
  after discovery. Verify actual export values and correction history.
sale_date_candidate_field: sale_dte
sale_date_candidate_semantics: >-
  Current CSV contains sale_dte and all 25 bounded sample values match the
  searched sale date. The indexed legacy dictionary maps this field to RP-5217
  title conveyance; current close-date semantics remain unverified.
