quarterly_report_date_mapping: >-
  Official ORPTS quarterly-report guidance maps Sale Date to RP-5217 item 12
  transfer date and Deed Date to item C2 county-clerk recording. RP-5217 item
  11 is contract date; item 12 is generally closing/title conveyance.
